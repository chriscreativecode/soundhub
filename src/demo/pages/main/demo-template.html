<div class="sound-manager-demo">
  <div class="control-group sound-manager-intro">
    <header class="sound-manager-header">
      <div class="title-container">
        <div class="main-title-container">
          <h1 class="main-title">Web Sound Manager</h1>
          <span class="version-badge">v5.3.0</span>
        </div>
        <div class="theme-toggle-container">
          <div class="theme-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" class="theme-icon--moon">
              <path strokeLinecap="round" strokeLinejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="theme-icon--sun">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
          </div>
          <div class="theme-toggle">
            <label class="theme-switch">
              <input type="checkbox" id="themeToggle">
              <span class="theme-slider round"></span>
            </label>
          </div>
        </div>

        <span class="copyright">© Chris Schardijn</span>
      </div>
      <div class="subtitle">
        <span class="tagline">Advanced Audio Control for Modern Web Apps</span>
        <div class="links-container">
          <a
            href="https://chriscreativecode.com/sound-manager-ts/documentation/#documentation"
            class="header-link docs-link"
            target="_blank"
            rel="noopener"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path
                d="M11.25 4.533A9.707 9.707 0 006 3a9.735 9.735 0 00-3.25.555.75.75 0 00-.5.707v14.25a.75.75 0 001 .707A8.237 8.237 0 016 18.75c1.995 0 3.823.707 5.25 1.886V4.533zM12.75 20.636A8.214 8.214 0 0118 18.75c.966 0 1.89.166 2.75.47a.75.75 0 001-.708V4.262a.75.75 0 00-.5-.707A9.735 9.735 0 0018 3a9.707 9.707 0 00-5.25 1.533v16.103z"
              />
            </svg>
            Docs
          </a>
          <a
            href="https://www.npmjs.com/package/sound-manager-ts?activeTab=readme"
            class="header-link npm-link"
            target="_blank"
            rel="noopener"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path
                d="M12 1.5a.75.75 0 01.75.75v2.25h9a.75.75 0 01.75.75v12a.75.75 0 01-.75.75H1.5a.75.75 0 01-.75-.75v-12a.75.75 0 01.75-.75h9V2.25A.75.75 0 0112 1.5z"
              />
            </svg>
            NPM

        </div>
      </div>
    </header>
    <div class="control-content">
      <button class="preload-btn" title="Preload">
        <span class="button-text">Preload demo sounds</span>
        <span class="spinner"></span>
      </button>
    </div>
  </div>

  <!-- Master Controls -->
   <div id="masterControlContainer"></div>

  <!-- Sound Controls Container -->
  <div id="soundControlsContainer">
    <!-- Sound controls will be dynamically added here -->
  </div>
</div>
