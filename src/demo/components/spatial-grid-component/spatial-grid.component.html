<div class="spatial-grid-container">
    <div class="front-line">front</div>
    <div class="spatial-grid">
        <div class="spatial-position-circle" draggable="false"></div>
        <div class="spatial-grid-lines"></div>
    </div>
    <!-- Vertical Slider for Y Position -->
    <div class="vertical-slider-container">
        <input type="range" class="vertical-slider" min="-1" max="1" value="0" step="0.01" title="Height control (-1 to 1)" />
    </div>
    <div class="spatial-controls">
        <div class="spatial-coordinates"><strong>Position:</strong><br /> X: 0,<br /> Y: 0,<br /> Z: 0</div>
    </div>
</div>
