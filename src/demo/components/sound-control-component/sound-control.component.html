<article class="control-group sound-control" data-sound-id="{{soundId}}" data-category="{{category}}">
  <div class="channel">
    <button type="button" class="channel__disclosure" aria-expanded="false"
      title="Show every control for {{label}}">
      {{iconCollapse}}
      <span class="channel__disclosure-sr">Show every control for {{label}}</span>
    </button>

    <span class="channel__glyph" aria-hidden="true">{{categoryIcon}}</span>

    <div class="channel__identity">
      <div class="channel__name-row">
        <h3 class="channel__name">{{label}}</h3>
        {{spriteBadge}}
      </div>
      <p class="channel__meta">
        <span class="channel__category">{{categoryLabel}}</span>
        <code class="channel__id">{{soundId}}</code>
      </p>
    </div>

    <div class="channel__meter" aria-hidden="true"><span class="channel__meter-fill"></span></div>

    <span class="channel__time time-display">0:00 / 0:00</span>

    <div class="channel__transport">
      <button class="icon-button playpause-btn" title="Play {{label}}" aria-label="Play {{label}}">
        <span class="play-icon">{{iconPlay}}</span>
        <span class="pause-icon" style="display: none">{{iconPause}}</span>
      </button>
      <button class="icon-button stop-btn" title="Stop {{label}}" aria-label="Stop {{label}}">{{iconStop}}</button>
      <button class="icon-button mute-btn" title="Mute {{label}}" aria-label="Mute {{label}}">
        <span class="mute-icon">{{iconMute}}</span>
        <span class="unmute-icon" style="display: none">{{iconUnmute}}</span>
      </button>
    </div>

    <div class="channel__volume">
      <input type="range" class="volume-slider" min="0" max="1" value="1" step="0.01"
        aria-label="Volume for {{label}}" />
      <span class="channel__volume-value volume-value">100%</span>
    </div>

    <button class="icon-button close-btn" title="Remove {{label}} from this page"
      aria-label="Remove {{label}} from this page">
      {{iconClose}}
    </button>
  </div>

  <div class="channel__progressline" aria-hidden="true"><span class="channel__progressline-fill"></span></div>

  <div class="sound-control__body" hidden>
    <p class="sound-control__blurb">{{blurb}}</p>

    <div class="control-content">
      <div class="control-group">
        <h4>Playback</h4>
        <div class="control-content">
          <div class="button-group">
            <button class="icon-button fade-in-btn" title="Fade in" aria-label="Fade in">{{iconFadeIn}}</button>
            <button class="icon-button fade-out-btn" title="Fade out" aria-label="Fade out">{{iconFadeOut}}</button>
            <button class="icon-button reset-sound-btn" title="Reset this sound"
              aria-label="Reset this sound">{{iconReset}}</button>

            <div class="playback-rate-container">
              <label class="field-label" for="rate-{{soundId}}">Playback rate</label>
              <input id="rate-{{soundId}}" type="number" class="playback-rate-input" min="0" max="9999" step="0.01"
                value="1" title="1 is normal speed" />
              <button type="button" class="step-button step-up" tabindex="-1" aria-hidden="true">+</button>
              <button type="button" class="step-button step-down" tabindex="-1" aria-hidden="true">-</button>
            </div>
          </div>
        </div>
      </div>

      <div class="control-group">
        <h4>Loop</h4>
        <div class="control-content">
          <div class="loop-controls">
            <label class="checkbox-container">
              <input type="checkbox" class="loop-checkbox">
              <span class="checkbox-label">Repeat when it reaches the end</span>
            </label>

            <div class="loop-settings" style="display: none;">
              <div class="loop-count-container">
                <label class="field-label" for="loops-{{soundId}}">Max loops</label>
                <select id="loops-{{soundId}}" class="max-loops-select">
                  <option value="-1">Infinite</option>
                  <option value="custom">Custom</option>
                </select>
                <input type="number" class="max-loops-input" min="1" value="1" style="display: none;"
                  aria-label="Number of loops">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="control-content">
      <div class="control-group">
        <h4>Stereo panning</h4>
        <div class="control-content">
          <div class="slider-container">
            <input type="range" class="pan-slider" min="-1" max="1" value="0" step="0.01"
              aria-label="Stereo panning" title="-1 is hard left, 0 is centre, 1 is hard right" />
            <span class="pan-value">center</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <h4>Position</h4>
        <div class="control-content">
          <div class="slider-container">
            <input type="range" class="progress-slider" min="0" max="100" value="0" step="0.1"
              aria-label="Playback position" />
          </div>
        </div>
      </div>
    </div>

    <div class="control-content">
      <div class="control-group">
        <div class="control-header">
          <h4>Spatial audio (3D)</h4>
          <button class="icon-button collapse-btn" title="Toggle 3D panel"
            aria-label="Toggle 3D panel">{{iconCollapse}}</button>
        </div>
        <div class="control-content spatial-content collapsed">
          <div class="spatial-grid-container-wrapper">
          </div>
          <div class="spatial-settings">
            <div class="spatial-setting-group">
              <label>Panning Model:</label>
              <select class="panning-model-select">
                <option value="HRTF">HRTF</option>
                <option value="equalpower">Equal Power</option>
              </select>
            </div>

            <div class="spatial-setting-group">
              <label>Distance Model:</label>
              <select class="distance-model-select">
                <option value="inverse">Inverse</option>
                <option value="linear">Linear</option>
                <option value="exponential">Exponential</option>
              </select>
            </div>

            <div class="spatial-setting-group">
              <label>Reference Distance:</label>
              <input type="number" class="ref-distance-input" min="0" value="1" step="0.1">
            </div>

            <div class="spatial-setting-group">
              <label>Max Distance:</label>
              <input type="number" class="max-distance-input" min="1" value="10000" step="100">
            </div>

            <div class="spatial-setting-group">
              <label>Rolloff Factor:</label>
              <input type="number" class="rolloff-factor-input" min="0" value="0.2" step="0.1">
            </div>

            <div class="spatial-setting-group">
              <label>Cone Inner Angle:</label>
              <input type="number" class="cone-inner-angle-input" min="0" max="360" value="360" step="1">
            </div>

            <div class="spatial-setting-group">
              <label>Cone Outer Angle:</label>
              <input type="number" class="cone-outer-angle-input" min="0" max="360" value="360" step="1">
            </div>

            <div class="spatial-setting-group">
              <label>Cone Outer Gain:</label>
              <input type="number" class="cone-outer-gain-input" min="0" max="1" value="0" step="0.1">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
