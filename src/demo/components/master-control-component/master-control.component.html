<div class="control-group sticky master-controls">
  <div class="control-content">
    <div class="control-group">
      <h4>Master transport</h4>
      <div class="control-content">
        <div class="button-group-global">
          <button id="pauseAllBtn" class="icon-button pause-btn" title="Pause every channel"
            aria-label="Pause every channel">{{iconPause}}</button>
          <button id="resumeAllBtn" class="icon-button play-btn" title="Resume every paused channel"
            aria-label="Resume every paused channel">{{iconPlay}}</button>
          <button id="stopAllBtn" class="icon-button stop-btn" title="Stop every channel"
            aria-label="Stop every channel">{{iconStop}}</button>
          <button id="toggleMuteBtn" class="icon-button mute-btn" title="Mute the master output"
            aria-label="Mute the master output">
            <span class="mute-icon">{{iconMute}}</span>
            <span class="unmute-icon" style="display: none">{{iconUnmute}}</span>
          </button>
          <button id="fadeInBtn" class="icon-button fade-in-btn" title="Fade the master output in"
            aria-label="Fade the master output in">{{iconFadeIn}}</button>
          <button id="fadeOutBtn" class="icon-button fade-out-btn" title="Fade the master output out"
            aria-label="Fade the master output out">{{iconFadeOut}}</button>
          <button id="resetBtn" class="icon-button stop-btn" title="Reset every sound to its starting settings"
            aria-label="Reset every sound to its starting settings">{{iconReset}}</button>
        </div>
      </div>
    </div>
    <div class="control-group">
      <h4>Master volume</h4>
      <div class="control-content">
        <div class="slider-container">
          <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="1"
            aria-label="Master volume" />
          <span id="masterVolumeValue">100%</span>
        </div>
      </div>
    </div>

    <div class="control-group">
      <h4>Master panning</h4>
      <div class="control-content">
        <div class="slider-container">
          <input type="range" id="masterPanning" min="-1" max="1" step="0.01" value="0"
            aria-label="Master panning" />
          <span id="masterPanValue">center</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Wave Visualizer -->
  <div id="waveVisualizerContainer"></div>

  <!-- Master Spatial Audio Controls -->
  <div class="control-group master-spatial-controls">
    <div class="control-header">
      <h4>Master Spatial Audio (3D)</h4>
      <button class="icon-button collapse-btn" title="Toggle panel">{{iconCollapse}}</button>
    </div>
    <div class="control-content spatial-content collapsed">
      <div class="spatial-grid-container-wrapper">
      </div>
      <div class="spatial-settings">
        <div class="spatial-setting-group">
          <label>Panning Model:</label>
          <select class="panning-model-select">
            <option value="HRTF">HRTF</option>
            <option value="equalpower">Equal Power</option>
          </select>
        </div>
        <div class="spatial-setting-group">
          <label>Distance Model:</label>
          <select class="distance-model-select">
            <option value="inverse">Inverse</option>
            <option value="linear">Linear</option>
            <option value="exponential">Exponential</option>
          </select>
        </div>
        <div class="spatial-setting-group">
          <label>Reference Distance:</label>
          <input type="number" class="ref-distance-input" min="0" value="1" step="0.1" />
        </div>
        <div class="spatial-setting-group">
          <label>Max Distance:</label>
          <input type="number" class="max-distance-input" min="1" value="10000" step="100" />
        </div>
        <div class="spatial-setting-group">
          <label>Rolloff Factor:</label>
          <input type="number" class="rolloff-factor-input" min="0" value="0.2" step="0.1" />
        </div>
        <div class="spatial-setting-group">
          <label>Cone Inner Angle:</label>
          <input type="number" class="cone-inner-angle-input" min="0" max="360" value="360" step="1" />
        </div>
        <div class="spatial-setting-group">
          <label>Cone Outer Angle:</label>
          <input type="number" class="cone-outer-angle-input" min="0" max="360" value="360" step="1" />
        </div>
        <div class="spatial-setting-group">
          <label>Cone Outer Gain:</label>
          <input type="number" class="cone-outer-gain-input" min="0" max="1" value="0" step="0.1" />
        </div>
      </div>
    </div>
  </div>
</div>
