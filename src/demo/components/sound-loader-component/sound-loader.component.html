<div class="sound-loader" role="status" aria-live="polite">
  <div class="sound-loader__head">
    <h2 class="sound-loader__title">Loading sounds</h2>
    <p class="sound-loader__subtitle">
      Every sound is decoded up front, so playback starts the moment you press a button.
    </p>
  </div>

  <div class="sound-loader__desk" aria-hidden="true"></div>

  <div class="sound-loader__meta">
    <span class="sound-loader__count">
      <strong class="sound-loader__done">0</strong><span class="sound-loader__of"> of </span><span
        class="sound-loader__total">0</span> ready
    </span>
    <span class="sound-loader__current"></span>
  </div>
</div>
