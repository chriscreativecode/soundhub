<div class="sound-manager-demo">
    <h2>Sound Manager Demo</h2>
    
    <div class="control-panel">
        <!-- Sound Loading Section -->
        <div class="section">
            <h3>Load Sounds</h3>
            <button id="loadSoundsBtn">Load Demo Sounds</button>
        </div>

        <!-- Individual Sound Controls -->
        <div class="section">
            <h3>Sound Controls</h3>
            <div class="sound-controls">
                <select id="soundSelect">
                    <option value="">Select a sound...</option>
                </select>
                
                <div class="button-group">
                    <button id="playBtn">Play</button>
                    <button id="pauseBtn">Pause</button>
                    <button id="resumeBtn">Resume</button>
                    <button id="stopBtn">Stop</button>
                </div>

                <div class="volume-control">
                    <label>Volume:</label>
                    <input type="range" id="soundVolume" min="0" max="1" step="0.1" value="1">
                    <span id="soundVolumeValue">100%</span>
                </div>

                <div class="mute-control">
                    <button id="muteBtn">Mute</button>
                    <button id="unmuteBtn">Unmute</button>
                </div>
            </div>
        </div>

        <!-- Global Controls -->
        <div class="section">
            <h3>Global Controls</h3>
            <div class="global-controls">
                <div class="button-group">
                    <button id="pauseAllBtn">Pause All</button>
                    <button id="resumeAllBtn">Resume All</button>
                    <button id="stopAllBtn">Stop All</button>
                </div>

                <div class="volume-control">
                    <label>Master Volume:</label>
                    <input type="range" id="masterVolume" min="0" max="1" step="0.1" value="1">
                    <span id="masterVolumeValue">100%</span>
                </div>

                <button id="toggleMuteBtn">Toggle Mute</button>
            </div>
        </div>

        <!-- Sound Status -->
        <div class="section">
            <h3>Sound Status</h3>
            <div id="soundStatus" class="status-panel">
                No sounds loaded
            </div>
        </div>
    </div>
</div>
