<div class="sound-manager-demo">
  <!-- Load and Sound Controls Panel -->
  <div class="controls-section">
    <!-- Load Controls -->
    <div class="control-group">
      <h4>Load sound</h4>
      <div class="control-content">
        <button id="loadSoundsBtn">Load Demo Sounds</button>
        <select id="soundSelect">
          <option value="">Select a sound...</option>
        </select>
      </div>
    </div>

    <!-- Sound Controls -->
    <div class="control-group">
      <h4>Sound action</h4>
      <div class="control-content">
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resumeBtn" disabled>Resume</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="muteBtn" disabled>Mute</button>
        <button id="unmuteBtn" disabled>Unmute</button>
        <div class="loop-controls">
          <label>
            Loops:
            <input
              type="number"
              id="loopCount"
              value="0"
              min="0"
              step="1"
              title="0 for infinite loops, >0 for specific count"
              disabled
            />
          </label>
        </div>

        <div class="pan-controls">
          <label>
            Pan:
            <input
              type="range"
              id="panControl"
              min="-1"
              max="1"
              step="0.1"
              value="0"
              title="-1 (left) to 1 (right)"
              disabled
            />
            <span id="panValue">Center</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Fade Controls -->
    <div class="control-group">
      <h4>Fade Controls</h4>
      <div class="control-content">
        <button id="fadeInBtn" disabled>Fade In (current sound)</button>
        <div>
          <input
            type="number"
            id="fadeInDuration"
            value="2"
            min="0.1"
            max="10"
            step="0.1"
            title="Fade duration in seconds"
          />
          <span>seconds</span>
        </div>
      </div>
      <div class="volume-controls">
        <label>
          Sound Volume:
          <input
            type="range"
            id="soundVolume"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
          <span id="soundVolumeValue">100%</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Master Controls Panel -->
  <div class="controls-section">
    <div class="control-group">
      <h4>Master sound</h4>
      <div class="control-content">
        <button id="masterFadeInBtn">Fade In</button>
        <button id="masterFadeOutBtn">Fade Out</button>
        <div>
          <input
            type="number"
            id="masterFadeDuration"
            value="2"
            min="0"
            step="0.1"
          />
          <span>seconds</span>
        </div>
      </div>
      <div class="volume-controls">
        <label>
          Master Volume:
          <input
            type="range"
            id="masterVolume"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
          <span id="masterVolumeValue">100%</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Spatial Controls Panel -->
  <div class="controls-section">
    <div class="control-group">
      <h4>Spatial Audio</h4>
      <div class="control-content">
        <div class="position-controls">
          <label>
            X Position:
            <input
              type="range"
              id="positionX"
              min="-10"
              max="10"
              value="0"
              step="0.01"
            />
            <span id="positionXValue">0</span>
          </label>
          <label>
            Y Position:
            <input
              type="range"
              id="positionY"
              min="-10"
              max="10"
              value="0"
              step="0.01"
            />
            <span id="positionYValue">0</span>
          </label>
          <label>
            Z Position:
            <input
              type="range"
              id="positionZ"
              min="-10"
              max="10"
              value="0"
              step="0.01"
            />
            <span id="positionZValue">0</span>
          </label>
        </div>
        <button id="resetPositionBtn" disabled>Reset Position</button>
      </div>
    </div>
  </div>

  <!-- Global Controls Panel -->
  <div class="controls-section">
    <div class="control-group">
      <h4>Global controls</h4>
      <div class="control-content">
        <button id="pauseAllBtn">Pause All</button>
        <button id="resumeAllBtn">Resume All</button>
        <button id="stopAllBtn">Stop All</button>
        <button id="toggleMuteBtn">Toggle Mute</button>
      </div>
    </div>
  </div>

  <!-- Status Panel -->
  <div class="controls-section">
    <div class="control-group">
      <h4>Output</h4>
      <div id="soundStatus" class="status-panel"></div>
    </div>
  </div>
</div>
